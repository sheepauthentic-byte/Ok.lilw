# Language: YAML | File: .github/workflows/main.yml | Runtime: GitHub Actions (macos-latest) | Target: iOS arm64 (.dylib)
name: Build iOS Dylib

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos, ldid & iOS SDK Environment
        shell: bash
        run: |
          set -e
          export THEOS=$RUNNER_TEMP/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

          # Note: Clones Theos and pulls patched iOS SDKs supporting private frameworks; bypasses missing stock Xcode private headers
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz | tar -xzf - -C "$THEOS/sdks" --strip-components=1

          # Note: Installs prebuilt Procursus ldid binary directly into $THEOS/bin and validates execution; avoids Homebrew dpkg/fakeroot overhead and exit code 1
          curl -fSL https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_universal -o "$THEOS/bin/ldid"
          chmod +x "$THEOS/bin/ldid"
          
          # Remove macOS quarantine attribute if present and verify binary exists
          xattr -c "$THEOS/bin/ldid" 2>/dev/null || true
          ls -la "$THEOS/bin/ldid"

      - name: Verify Toolchain & Locate Build Root
        id: locate
        shell: bash
        run: |
          # Note: Dynamically finds the directory containing Makefile if nested in a subfolder; prevents failure when repo root is a wrapper
          MAKEFILE_PATH=$(find . -maxdepth 3 -name "Makefile" -not -path "./.git/*" | head -n 1)
          if [ -n "$MAKEFILE_PATH" ]; then
            BUILD_DIR=$(dirname "$MAKEFILE_PATH")
            echo "mode=theos" >> $GITHUB_OUTPUT
            echo "dir=$BUILD_DIR" >> $GITHUB_OUTPUT
            echo "Found Makefile in: $BUILD_DIR"
          else
            echo "mode=clang" >> $GITHUB_OUTPUT
            echo "dir=." >> $GITHUB_OUTPUT
            echo "No Makefile found. Falling back to direct xcrun clang++ compilation."
          fi

      - name: Compile Dylib (Theos Mode - No DEB Packaging)
        if: steps.locate.outputs.mode == 'theos'
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          # Note: Runs 'make all' instead of 'make package' to compile, strip, and ldid-sign the .dylib without invoking dpkg-deb or fakeroot
          make clean
          make all FINALPACKAGE=1 ARCHS="arm64" \
            THEOS_LDID="$THEOS/bin/ldid" \
            ADDITIONAL_CFLAGS="-Wno-error -Wno-deprecated-declarations -fvisibility=hidden" \
            ADDITIONAL_OBJCFLAGS="-Wno-error -Wno-deprecated-declarations -fobjc-arc"

      - name: Compile Dylib (Direct Clang Fallback Mode)
        if: steps.locate.outputs.mode == 'clang'
        shell: bash
        run: |
          mkdir -p build_out
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SOURCES=$(find . -type f \( -name "*.mm" -o -name "*.cpp" -o -name "*.m" -o -name "*.c" \) -not -path "./.git/*" -not -path "./build_out/*")
          INCLUDES=$(find . -type f \( -name "*.h" -o -name "*.hpp" \) -not -path "./.git/*" -exec dirname {} \; | sort -u | sed 's/^/-I/')
          STATIC_LIBS=$(find . -type f -name "*.a" -not -path "./.git/*")
          FRAMEWORK_DIRS=$(find . -type d -name "*.framework" -not -path "./.git/*" -exec dirname {} \; | sort -u | sed 's/^/-F/')

          # Note: Direct dynamic library compilation via AppleClang with @rpath install_name; works for standalone ESign/TrollStore dylib injection
          xcrun -sdk iphoneos clang++ -arch arm64 \
            -dynamiclib \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=14.0 \
            -std=c++17 \
            -fobjc-arc \
            -fvisibility=hidden \
            -Wno-deprecated-declarations \
            -Wno-unused-variable \
            -install_name @rpath/OkLilw.dylib \
            $INCLUDES \
            $FRAMEWORK_DIRS \
            $SOURCES \
            $STATIC_LIBS \
            -framework Foundation \
            -framework UIKit \
            -framework QuartzCore \
            -framework CoreGraphics \
            -framework Metal \
            -framework MetalKit \
            -framework Security \
            -framework SystemConfiguration \
            -framework WebKit \
            -o build_out/OkLilw.dylib

          strip -x build_out/OkLilw.dylib
          "$THEOS/bin/ldid" -S build_out/OkLilw.dylib || codesign -f -s - build_out/OkLilw.dylib

      - name: Collect & Re-Verify Compiled Dylib
        shell: bash
        run: |
          mkdir -p artifacts_output
          
          # Note: Collects compiled .dylib from .theos/obj/arm64/ or build_out/ and ensures ad-hoc signature is intact
          find . -type f -name "*.dylib" -not -path "./artifacts_output/*" -not -path "*/theos/*" -exec cp -v {} artifacts_output/ \;

          ls -la artifacts_output/
          if [ -z "$(ls -A artifacts_output/)" ]; then
            echo "Error: No .dylib produced!"
            exit 1
          fi

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OkLilw-iOS-Dylib-${{ github.sha }}
          path: artifacts_output/*.dylib
          if-no-files-found: error
          retention-days: 30
