# Language: YAML | File: .github/workflows/main.yml | Runtime: GitHub Actions (macos-latest) | Target: iOS arm64 (.dylib)
name: Build iOS Dylib

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos, ldid & iOS SDK Environment
        shell: bash
        run: |
          set -euo pipefail

          export THEOS="$RUNNER_TEMP/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

          # Clone Theos and install the iOS SDKs.
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fL https://github.com/theos/sdks/archive/master.tar.gz \
            | tar -xzf - -C "$THEOS/sdks" --strip-components=1

          # Install ldid from Homebrew instead of the release URL that returned 404.
          if ! command -v ldid >/dev/null 2>&1; then
            brew install ldid
          fi

          LDID_PATH="$(command -v ldid)"
          ln -sf "$LDID_PATH" "$THEOS/bin/ldid"
          "$THEOS/bin/ldid" -version || true

      - name: Verify Toolchain & Locate Build Root
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          MAKEFILE_PATH="$(find . -maxdepth 3 -name "Makefile" -not -path "./.git/*" | head -n 1)"
          if [ -n "$MAKEFILE_PATH" ]; then
            BUILD_DIR="$(dirname "$MAKEFILE_PATH")"
            echo "mode=theos" >> "$GITHUB_OUTPUT"
            echo "dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"
            echo "Found Makefile in: $BUILD_DIR"
          else
            echo "mode=clang" >> "$GITHUB_OUTPUT"
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "No Makefile found. Falling back to direct xcrun clang++ compilation."
          fi

      - name: Compile Dylib (Theos Mode - No DEB Packaging)
        if: steps.locate.outputs.mode == 'theos'
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          # Build the dylib without invoking dpkg-deb or fakeroot.
          make clean
          make all FINALPACKAGE=1 ARCHS="arm64" \
            THEOS_LDID="$THEOS/bin/ldid" \
            ADDITIONAL_CFLAGS="-Wno-error -Wno-deprecated-declarations -fvisibility=hidden" \
            ADDITIONAL_OBJCFLAGS="-Wno-error -Wno-deprecated-declarations -fobjc-arc"

      - name: Compile Dylib (Direct Clang Fallback Mode)
        if: steps.locate.outputs.mode == 'clang'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build_out
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SOURCES="$(find . -type f \( -name "*.mm" -o -name "*.cpp" -o -name "*.m" -o -name "*.c" \) -not -path "./.git/*" -not -path "./build_out/*")"
          INCLUDES="$(find . -type f \( -name "*.h" -o -name "*.hpp" \) -not -path "./.git/*" -exec dirname {} \; | sort -u | sed 's/^/-I/')"
          STATIC_LIBS="$(find . -type f -name "*.a" -not -path "./.git/*")"
          FRAMEWORK_DIRS="$(find . -type d -name "*.framework" -not -path "./.git/*" -exec dirname {} \; | sort -u | sed 's/^/-F/')"

          if [ -z "$SOURCES" ]; then
            echo "Error: No source files (.mm, .cpp, .m, or .c) were found."
            exit 1
          fi

          # Compile an arm64 iOS dynamic library.
          xcrun -sdk iphoneos clang++ -arch arm64 \
            -dynamiclib \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=14.0 \
            -std=c++17 \
            -fobjc-arc \
            -fvisibility=hidden \
            -Wno-deprecated-declarations \
            -Wno-unused-variable \
            -install_name @rpath/OkLilw.dylib \
            $INCLUDES \
            $FRAMEWORK_DIRS \
            $SOURCES \
            $STATIC_LIBS \
            -framework Foundation \
            -framework UIKit \
            -framework QuartzCore \
            -framework CoreGraphics \
            -framework Metal \
            -framework MetalKit \
            -framework Security \
            -framework SystemConfiguration \
            -framework WebKit \
            -o build_out/OkLilw.dylib

          strip -x build_out/OkLilw.dylib
          "$THEOS/bin/ldid" -S build_out/OkLilw.dylib \
            || codesign -f -s - build_out/OkLilw.dylib

      - name: Collect & Verify Compiled Dylib
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts_output
          find . -type f -name "*.dylib" \
            -not -path "./artifacts_output/*" \
            -not -path "*/theos/*" \
            -exec cp -v {} artifacts_output/ \;

          ls -la artifacts_output/
          if [ -z "$(ls -A artifacts_output/)" ]; then
            echo "Error: No .dylib produced!"
            exit 1
          fi

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OkLilw-iOS-Dylib-${{ github.sha }}
          path: artifacts_output/*.dylib
          if-no-files-found: error
          retention-days: 30
