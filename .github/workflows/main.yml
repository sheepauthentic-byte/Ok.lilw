# Language: YAML | File: .github/workflows/build-dylib.yml | Runtime: GitHub Actions (macos-latest) | Target: iOS arm64 (.dylib)
name: Build iOS Dylib

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos, ldid & iOS SDK Environment
        shell: bash
        run: |
          export THEOS=~/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

          # Note: Clones Theos and pulls patched iOS SDKs supporting private frameworks; bypasses missing stock Xcode private headers
          git clone --recursive https://github.com/theos/theos.git $THEOS
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz | tar -xzf - -C $THEOS/sdks --strip-components=1

          # Note: Fetches prebuilt universal macOS ldid binary directly from Procursus into $THEOS/bin; avoids exit code 127 and slow Homebrew formula builds
          curl -sL https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_universal -o $THEOS/bin/ldid || brew install ldid
          if [ -f "$THEOS/bin/ldid" ]; then
            chmod +x $THEOS/bin/ldid
          elif command -v ldid >/dev/null 2>&1; then
            ln -sf "$(command -v ldid)" $THEOS/bin/ldid
          fi

          # Note: Installs dpkg and fakeroot only if missing so 'make package' does not fail after ldid finishes signing
          if ! command -v dpkg-deb >/dev/null 2>&1; then
            brew install dpkg fakeroot
          fi

          which ldid
          ldid -version || true

      - name: Verify Toolchain & Locate Build Root
        id: locate
        shell: bash
        run: |
          # Note: Dynamically finds the directory containing Makefile if nested in a subfolder; prevents failure when repo root is a wrapper
          MAKEFILE_PATH=$(find . -maxdepth 3 -name "Makefile" -not -path "./.git/*" | head -n 1)
          if [ -n "$MAKEFILE_PATH" ]; then
            BUILD_DIR=$(dirname "$MAKEFILE_PATH")
            echo "mode=theos" >> $GITHUB_OUTPUT
            echo "dir=$BUILD_DIR" >> $GITHUB_OUTPUT
            echo "Found Makefile in: $BUILD_DIR"
          else
            echo "mode=clang" >> $GITHUB_OUTPUT
            echo "dir=." >> $GITHUB_OUTPUT
            echo "No Makefile found. Falling back to direct xcrun clang++ compilation."
          fi

      - name: Compile Dylib (Theos Mode)
        if: steps.locate.outputs.mode == 'theos'
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          # Note: Compiles with explicit ldid binary path and falls back to 'make all' if repo has no 'control' file for deb packaging
          make clean
          if [ -f "control" ]; then
            make package FINALPACKAGE=1 ARCHS="arm64" \
              ADDITIONAL_CFLAGS="-Wno-error -Wno-deprecated-declarations -fvisibility=hidden" \
              ADDITIONAL_OBJCFLAGS="-Wno-error -Wno-deprecated-declarations -fobjc-arc"
          else
            make all FINALPACKAGE=1 ARCHS="arm64" \
              ADDITIONAL_CFLAGS="-Wno-error -Wno-deprecated-declarations -fvisibility=hidden" \
              ADDITIONAL_OBJCFLAGS="-Wno-error -Wno-deprecated-declarations -fobjc-arc"
          fi

      - name: Compile Dylib (Direct Clang Fallback Mode)
        if: steps.locate.outputs.mode == 'clang'
        shell: bash
        run: |
          mkdir -p build_out
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SOURCES=$(find . -type f \( -name "*.mm" -o -name "*.cpp" -o -name "*.m" -o -name "*.c" \) -not -path "./.git/*" -not -path "./build_out/*")
          INCLUDES=$(find . -type f \( -name "*.h" -o -name "*.hpp" \) -not -path "./.git/*" -exec dirname {} \; | sort -u | sed 's/^/-I/')
          STATIC_LIBS=$(find . -type f -name "*.a" -not -path "./.git/*")
          FRAMEWORK_DIRS=$(find . -type d -name "*.framework" -not -path "./.git/*" -exec dirname {} \; | sort -u | sed 's/^/-F/')

          # Note: Direct dynamic library compilation via AppleClang with @rpath install_name; works for standalone ESign/TrollStore dylib injection
          xcrun -sdk iphoneos clang++ -arch arm64 \
            -dynamiclib \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=14.0 \
            -std=c++17 \
            -fobjc-arc \
            -fvisibility=hidden \
            -Wno-deprecated-declarations \
            -Wno-unused-variable \
            -install_name @rpath/OkLilw.dylib \
            $INCLUDES \
            $FRAMEWORK_DIRS \
            $SOURCES \
            $STATIC_LIBS \
            -framework Foundation \
            -framework UIKit \
            -framework QuartzCore \
            -framework CoreGraphics \
            -framework Metal \
            -framework MetalKit \
            -framework Security \
            -framework SystemConfiguration \
            -framework WebKit \
            -o build_out/OkLilw.dylib

          strip -x build_out/OkLilw.dylib
          ldid -S build_out/OkLilw.dylib || codesign -f -s - build_out/OkLilw.dylib

      - name: Collect Compiled Artifacts
        shell: bash
        run: |
          mkdir -p artifacts_output
          find . -type f -name "*.dylib" -not -path "./artifacts_output/*" -not -path "*/theos/*" -exec cp -v {} artifacts_output/ \;
          find . -type f -name "*.deb" -not -path "./artifacts_output/*" -exec cp -v {} artifacts_output/ \;

          ls -la artifacts_output/
          if [ -z "$(ls -A artifacts_output/)" ]; then
            echo "Error: No .dylib or .deb produced!"
            exit 1
          fi

      - name: Upload Dylib & Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OkLilw-iOS-Dylib-${{ github.sha }}
          path: |
            artifacts_output/*.dylib
            artifacts_output/*.deb
          if-no-files-found: error
          retention-days: 30
